name: Build Presidente Simulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - 'main.py'
      - 'v*.py'
      - 'countries_data.py'
      - 'buildozer.spec'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ANDROIDSDK: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential gcc g++ make patch ccache \
            autoconf automake autopoint libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            python3-dev python3-venv wget lbzip2
          sudo ldconfig

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "Cython==3.0.12"
          cython --version

      - name: Prepare licensed Android SDK for Buildozer
        run: |
          mkdir -p "$ANDROIDSDK/cmdline-tools"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$ANDROIDSDK/cmdline-tools/latest"
          mkdir -p "$ANDROIDSDK/licenses"
          if [ -d /usr/local/lib/android/sdk/licenses ]; then
            cp -a /usr/local/lib/android/sdk/licenses/. "$ANDROIDSDK/licenses/"
          fi
          yes | "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROIDSDK" --licenses >/dev/null || true
          "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROIDSDK" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          rm -rf "$ANDROIDSDK/tools"
          cp -a "$ANDROIDSDK/cmdline-tools/latest" "$ANDROIDSDK/tools"

          test -x "$ANDROIDSDK/build-tools/33.0.2/aidl"
          test -x "$ANDROIDSDK/tools/bin/sdkmanager"
          "$ANDROIDSDK/tools/bin/sdkmanager" --sdk_root="$ANDROIDSDK" --list >/dev/null

      - name: Prepare pinned python-for-android
        run: |
          git clone --depth 1 --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git .p4a

      - name: Fix target platform for p4a dependency installation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path(".p4a/pythonforandroid/build.py")
          source = path.read_text(encoding="utf-8")
          old = r'''            shprint(sh.bash, '-c', (
                          "venv/bin/pip " +
                          "install -v --target '{0}' --no-deps -r requirements.txt"
                      ).format(ctx.get_site_packages_dir(arch).replace("'", "'\"'\"'")),
                              _env=copy.copy(env))'''
          new = r'''            platform_args = [
                          f"--platform={tag}"
                          for tag in PyProjectRecipe.get_wheel_platform_tags(arch.arch, ctx)
                      ]
                      shprint(
                          sh.Command(join(ctx.build_dir, "venv", "bin", "pip")),
                          "install", "-v",
                          "--target", ctx.get_site_packages_dir(arch),
                          "--no-deps", "--only-binary=:all:",
                          "--python-version", ctx.python_recipe.version,
                          *platform_args, "-r", "requirements.txt",
                          _env=copy.copy(env),
                      )'''
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one legacy p4a pip install call")
          patched = source.replace(old, new, 1)
          ast.parse(patched, filename=str(path))
          path.write_text(patched, encoding="utf-8")
          print("Patched p4a pip install to use the target Android platform and Python version")
          PY

      - name: Validate pinned Android toolchain
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def recipe_version(name):
              recipe_path = Path(f".p4a/pythonforandroid/recipes/{name}/__init__.py")
              tree = ast.parse(recipe_path.read_text(encoding="utf-8"), recipe_path)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign) and len(node.targets) == 1:
                      target = node.targets[0]
                      if isinstance(target, ast.Name) and target.id == "version":
                          return ast.literal_eval(node.value)
              raise AssertionError(f"No version found in {recipe_path}")

          expected = {
              "hostpython3": "3.14.2",
              "python3": "3.14.2",
              "kivy": "2.3.1",
              "sdl2": "2.30.11",
          }
          configured = {name: recipe_version(name) for name in expected}
          assert configured == expected, configured
          print("Pinned p4a recipe versions:", configured)
          PY

      - name: Build debug APK
        run: |
          rm -rf .buildozer ~/.buildozer
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Presidente-Simulator-V0.6-APK
          path: bin/*.apk
          if-no-files-found: error
