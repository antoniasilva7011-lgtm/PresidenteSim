
name: Build Presidente Simulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/pip-constraints.txt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential gcc g++ make patch ccache \
            autoconf automake autopoint libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            python3-dev python3-venv wget lbzip2
          sudo ldconfig

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip==24.0"
          python -m pip install "setuptools==69.5.1" "wheel==0.43.0"
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Prepare pinned python-for-android and SDL2
        run: |
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git .p4a
          sed -i \
            -e 's/2\.28\.5/2.30.11/' \
            -e 's/a344eb827a03045c9b399e99af4af13d/bea190b480f6df249db29eb3bacfe41e/' \
            .p4a/pythonforandroid/recipes/sdl2/__init__.py

      - name: Validate configured SDL2 release
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          recipe_path = Path(".p4a/pythonforandroid/recipes/sdl2/__init__.py")
          tree = ast.parse(recipe_path.read_text(encoding="utf-8"), recipe_path)
          configured = {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and len(node.targets) == 1:
                  target = node.targets[0]
                  if isinstance(target, ast.Name) and target.id in {"version", "url", "md5sum"}:
                      configured[target.id] = ast.literal_eval(node.value)
          assert configured.get("version") == "2.30.11", configured
          assert configured.get("md5sum") == "bea190b480f6df249db29eb3bacfe41e", configured
          print(configured)
          PY

      - name: Build debug APK
        run: |
          rm -rf .buildozer ~/.buildozer
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Presidente-Simulator-V0.1-APK
          path: bin/*.apk
          if-no-files-found: error
