
name: Build Presidente Simulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # p4a creates another venv and upgrades pip inside it. A global constraint
      # keeps that subprocess on the pip API supported by pinned p4a.
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/pip-constraints.txt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip==24.0"
          python -m pip install "setuptools==69.5.1" "wheel==0.43.0"
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Prepare pinned python-for-android and SDL2
        run: |
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git .p4a

          # p4a v2024.01.21 pins SDL 2.28.5, whose Android sensor backend uses
          # ALooper_pollAll. SDL 2.30.11 uses ALooper_pollOnce and builds with NDK r27c.
          grep -Fq "version = '2.28.5'" .p4a/pythonforandroid/recipes/sdl2/__init__.py
          sed -i "s/version = '2.28.5'/version = '2.30.11'/" \
            .p4a/pythonforandroid/recipes/sdl2/__init__.py
          grep -Fq "version = '2.30.11'" .p4a/pythonforandroid/recipes/sdl2/__init__.py

      - name: Build debug APK
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Presidente-Simulator-V0.1-APK
          path: bin/*.apk
          if-no-files-found: error
