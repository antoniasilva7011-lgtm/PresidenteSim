name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'godot/**'
      - '.github/workflows/godot-build-apk.yml'

jobs:
  build-godot-apk:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: '4.4.1'
      GODOT_RELEASE: '4.4.1-stable'
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android-debug/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map preparation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Prepare Natural Earth map
        run: python godot/tools/prepare_data.py

      - name: Prepare Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/licenses"
          if [ -d /usr/local/lib/android/sdk/licenses ]; then
            cp -a /usr/local/lib/android/sdk/licenses/. "$ANDROID_HOME/licenses/"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Create Android debug keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.android-debug"
          if [ ! -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
              -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
              -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" >/dev/null

      - name: Download Godot 4.4.1 and Android export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot-bin
          chmod +x godot-bin

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d godot-templates
          cp -a godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          export/android/debug_keystore_user = "$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          export/android/debug_keystore_pass = "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          EOF

      - name: Import project
        run: ./godot-bin --headless --path godot --editor --quit-after 5

      - name: Export debug APK
        run: |
          mkdir -p godot-build
          ./godot-bin --headless --path godot --verbose --export-debug "Android" "$GITHUB_WORKSPACE/godot-build/PresidenteSim-Godot.apk"
          test -s godot-build/PresidenteSim-Godot.apk
          ls -lh godot-build/PresidenteSim-Godot.apk

      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: Presidente-Simulator-Godot-APK-v0.6
          path: godot-build/PresidenteSim-Godot.apk
          if-no-files-found: error
          retention-days: 14
